name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip ShopeeDivulgaAI-pronto-para-build.zip -d extracted

      - name: Construir aplicativo
        run: |
          cd extracted/ShopeeDivulgaAI
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopee-Divulga-AI
          path: extracted/ShopeeDivulgaAI/app/build/outputs/apk/debug/app-debug.apk
